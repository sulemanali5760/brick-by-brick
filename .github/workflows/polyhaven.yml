# Fetch and convert Poly Haven (CC0) assets on a GitHub runner, never on the dev laptop (LESSONS L21).
name: polyhaven
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from api.polyhaven.com
        run: python tools/fetch_polyhaven.py
      - name: Install Blender 4.2 LTS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
      - name: Convert
        run: ./blender-4.2.3-linux-x64/blender --background --factory-startup --python blender/convert_polyhaven.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: npm install --no-save gltf-validator && node tools/validate_assets.mjs
      - name: Commit converted assets
        run: |
          rm -rf blender-4.2.3-linux-x64 node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Convert Poly Haven assets on CI" && git push)
