# Automated acceptance run: headless Chrome (WebGL via SwiftShader) plays the build at desktop,
# small-window and phone sizes, checks the acceptance criteria and keeps screenshots.
name: qa
on: [push, workflow_dispatch]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve the game
        run: python3 -m http.server 8080 &
      - run: node qa/acceptance.mjs http://localhost:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: qa/out
