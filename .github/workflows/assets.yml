name: assets
on:
  push:
    paths: ['assets/**', 'tools/validate_assets.mjs', '.github/workflows/assets.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save gltf-validator
      - run: node tools/validate_assets.mjs
